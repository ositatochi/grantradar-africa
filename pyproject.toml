[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grantradar-africa"
version = "0.1.0"
description = "A trusted discovery and tracking platform for funding opportunities in Africa."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.4,<6",
    "dateparser>=1.2,<2",
    "django>=5.2,<6",
    "django-allauth>=65,<66",
    "django-anymail>=12,<14",
    "django-celery-beat>=2.8,<3",
    "django-filter>=25,<26",
    "django-otp>=1.5,<2",
    "django-ratelimit>=4.1,<5",
    "django-unfold>=0.60,<1",
    "djangorestframework>=3.16,<4",
    "drf-spectacular>=0.28,<1",
    "feedparser>=6.0,<7",
    "flower>=2.0,<3",
    "gunicorn>=23,<24",
    "httpx>=0.28,<1",
    "meilisearch>=0.36,<1",
    "nh3>=0.2,<1",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pycountry>=24.6,<26",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
    "rapidfuzz>=3.13,<4",
    "sentry-sdk[django]>=2.25,<3",
    "scrapy>=2.13,<3",
    "scrapy-playwright>=0.0.43,<1",
    "selectolax>=0.3,<1",
    "structlog>=25,<26",
    "tldextract>=5.2,<6",
    "trafilatura>=2.0,<3",
    "w3lib>=2.3,<3",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=5.1,<6",
    "django-stubs[compatible-mypy]>=5.2,<6",
    "factory-boy>=3.3,<4",
    "mypy>=1.15,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<9",
    "pytest-django>=4.11,<5",
    "pytest-env>=1.1,<2",
    "ruff>=0.11,<1",
    "types-python-dateutil>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["grantradar", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "grantradar.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]

[tool.pytest_env]
DJANGO_TEST_SQLITE = "1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.crawler.tasks", "apps.pipeline.tasks"]
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = ["apps.search.tasks"]
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = ["apps.alerts.tasks", "apps.tracker.tasks"]
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = ["apps.accounts.forms", "apps.tracker.forms"]
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["allauth.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.search.views"]
disable_error_code = ["untyped-decorator", "type-arg"]

[[tool.mypy.overrides]]
module = ["apps.search.sitemaps"]
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["django_ratelimit.decorators", "django_ratelimit.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "grantradar.settings"
