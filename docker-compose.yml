services:
  django:
    build: .
    env_file: .env
    command: >-
      sh -c "uv run --no-sync python manage.py migrate --noinput &&
      uv run --no-sync gunicorn grantradar.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grantradar}
      POSTGRES_USER: ${POSTGRES_USER:-grantradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-this-local-meilisearch-key}
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped

  celery-worker:
    build: .
    env_file: .env
    command: ["uv", "run", "--no-sync", "celery", "-A", "grantradar", "worker", "--loglevel=info"]
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: .
    env_file: .env
    command: ["uv", "run", "--no-sync", "celery", "-A", "grantradar", "beat", "--loglevel=info"]
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  playwright-worker:
    build: .
    env_file: .env
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - grantradar
      - worker
      - --queues=playwright
      - --loglevel=info
    profiles: ["crawler"]
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build: .
    env_file: .env
    command: ["uv", "run", "--no-sync", "celery", "-A", "grantradar", "flower", "--address=0.0.0.0", "--port=5555"]
    ports:
      - "5555:5555"
    profiles: ["monitoring"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
